<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Quendify · Kasa</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Charte admin Quendify : nuit + laiton. Laiton = Sonsuz, bleu-vert clair = Moi. */
:root{
  --bg:#0B2E33; --surface:#0F3B41; --surface-2:#14474E; --ink:#F3EAD8; --muted:rgba(243,234,216,.6); --line:rgba(243,234,216,.14);
  --accent:#7FC8D8; --accent-soft:rgba(127,200,216,.14); --gold:#C9A227; --gold-soft:rgba(201,162,39,.16); --on-accent:#0B2E33;
  --pos:#7BD389; --neg:#FF8A7A; --warn:#E5C766; --warn-soft:rgba(229,199,102,.12); --neg-soft:rgba(255,138,122,.12); --pos-soft:rgba(123,211,137,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{-webkit-font-smoothing:antialiased;min-height:100vh}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px 140px}
.top{display:flex;align-items:center;gap:12px;padding-block:8px 16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.06em}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em;font-variation-settings:normal}
.top .sp{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 2px;cursor:pointer}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
@media (min-width:760px){
  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border:1px solid var(--line);border-radius:14px;margin-bottom:20px;grid-template-columns:repeat(5,auto);justify-content:start;gap:4px;padding:5px}
  nav.tabs button{flex-direction:row;font-size:14px;padding:8px 14px;border-radius:10px;gap:8px}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft)}
  .app{padding-block:20px 80px}
}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;height:56px;padding:0 22px 0 18px;border-radius:18px;border:0;background:var(--gold);color:var(--on-accent);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer}
.fab svg{width:20px;height:20px}
@media (min-width:760px){.fab{bottom:28px;right:28px}}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.hero{padding:20px}
.hero .lab{font-size:13px;color:var(--muted);font-weight:500}
.big{font-family:var(--f-display);font-variation-settings:"wdth" 112;font-weight:700;font-size:clamp(34px,8vw,52px);line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0 14px;overflow-wrap:anywhere}
.big .cur{font-size:.42em;color:var(--muted);font-weight:600;margin-left:6px;letter-spacing:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{border-radius:12px;padding:10px 12px;min-width:0}
.pill .k{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pill .v{font-family:var(--f-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.moi{background:var(--accent-soft)} .moi .k{color:var(--accent)}
.son{background:var(--gold-soft)} .son .k{color:var(--gold)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--f-mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.monthnav span{font-weight:600;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);min-width:110px;text-align:center}
.budget{display:grid;gap:12px}
.brow .t{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.brow .t b{font-weight:500}
.brow .t span{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:14px}
.alert.w{background:var(--warn-soft)} .alert.w b{color:var(--warn)}
.alert.n{background:var(--neg-soft)} .alert.n b{color:var(--neg)}
.alert.o{background:var(--pos-soft)} .alert.o b{color:var(--pos)}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:currentColor}
.list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-size:12px;color:var(--muted)}
.badge{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em}
.badge.moi{color:var(--accent)} .badge.son{color:var(--gold)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;vertical-align:1px}
.tag.moi{color:var(--accent)} .tag.son{color:var(--gold)}
.day{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:14px 0 2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--on-accent)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--neg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty h3{font-family:var(--f-display);font-variation-settings:"wdth" 110;color:var(--ink);font-size:20px;margin:0 0 6px;text-wrap:balance}
.empty p{max-width:46ch;margin:0 auto 14px}
.presets{display:grid;gap:14px;text-align:left}
.presets .grp{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.trend{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:8px}
.trend .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%}
.trend .cols{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.trend .cols i{width:40%;max-width:16px;border-radius:4px 4px 0 0;display:block}
.trend .lb{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,28,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h3{margin:0;font-family:var(--f-display);font-variation-settings:"wdth" 115;font-size:20px;font-weight:700}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.form{display:grid;gap:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:10px 12px;font-size:16px}
.amtin{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.amtin input{border:0;background:transparent;font-family:var(--f-display);font-variation-settings:"wdth" 110;font-weight:700;font-size:40px;width:100%;min-width:0;padding:0;font-variant-numeric:tabular-nums}
.amtin input:focus{outline:none}
.amtin span{font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--neg);font-size:13px;min-height:1em}
.hint{font-size:12.5px;color:var(--muted)}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1;padding:9px}
.gate{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.gate h2{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;margin:0 0 6px;text-align:center}
.gate p{color:var(--muted);font-size:13px;text-align:center;margin:0 0 18px}
.gate .form{gap:10px}
/* chat */
.chat{display:grid;gap:10px;margin-bottom:12px}
.msg{padding:12px 14px;border-radius:14px;max-width:88%;overflow-wrap:anywhere;font-size:15px}
.msg.u{justify-self:end;background:var(--accent);color:var(--on-accent)}
.msg.a{background:var(--surface-2)}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;resize:none;min-height:46px;font-size:16px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.checkrow{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.checkrow input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;width:100%;font-family:var(--f-mono);text-align:right}
.skel{height:14px;border-radius:7px;background:var(--surface-2);margin:8px 0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>

<script>
(function(){
"use strict";
var SUPABASE_URL="https://wptgwvzyremlkboyrpwk.supabase.co";
var SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwdGd3dnp5cmVtbGtib3lycHdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NTAxMzAsImV4cCI6MjA4OTUyNjEzMH0.8oq0NuumF83XnjmYgr-R_xWkOqB9cBAY9SmP-nzzD5Y";
var CUR={USDT:{l:"USDT",d:2},XOF:{l:"FCFA",d:0},XAF:{l:"FCFA (XAF)",d:0},TRY:{l:"₺",d:2},USD:{l:"$",d:2},EUR:{l:"€",d:2}};
var CODES=["XOF","XAF","TRY","USDT","USD","EUR"];
var DEFAULT_RATES={USDT:1,USD:1,EUR:0.893,XOF:586,XAF:586,TRY:49.16};
var TYPES={momo:"Mobile money",banque:"Banque",crypto:"Crypto",especes:"Espèces"};
var TYPE_BADGE={momo:"MM",banque:"BQ",crypto:"₮",especes:"CASH"};

/* ---------- API ---------- */
function token(){try{return sessionStorage.getItem("qnd_admin_pass")||"";}catch(e){return "";}}
function ApiError(msg,status){this.message=msg;this.status=status;}
async function api(action,payload){
  var r;
  try{r=await fetch(SUPABASE_URL+"/functions/v1/kasa",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify(Object.assign({admin_pass:token(),action:action},payload||{}))});}
  catch(e){throw new ApiError("Connexion impossible. Vérifie ton réseau et réessaie.",0);}
  var d={};try{d=await r.json();}catch(e){}
  if(r.status===401){showGate("Session expirée. Reconnecte-toi.");throw new ApiError("Session expirée.",401);}
  if(!r.ok||d.error)throw new ApiError(d.error||("Erreur serveur ("+r.status+")."),r.status);
  return d;
}
function byId(rows,map){var o={};(rows||[]).forEach(function(r){var x=map(r);o[x.id]=x;});return o;}
async function load(){

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return n<10?"0"+n:""+n;}
function monthKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function shiftMonth(k,n){var p=k.split("-"),d=new Date(+p[0],+p[1]-1+n,1);return monthKey(d);}
function monthLabel(k){var p=k.split("-");return MONTHS[+p[1]-1]+" "+p[0];}
function rates(){return (S.settings&&S.settings.rates)||DEFAULT_RATES;}
function toBase(a,c){var r=rates()[c]||DEFAULT_RATES[c]||1;return (+a||0)/r;}
function fromBase(b,c){var r=rates()[c]||DEFAULT_RATES[c]||1;return (+b||0)*r;}
function num(v,dec){return new Intl.NumberFormat("fr-FR",{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(v);}
function fmt(a,c){var k=CUR[c]||{l:c,d:2};return num(a,k.d)+" "+k.l;}
function show(b){return fmt(fromBase(b,S.disp),S.disp);}
function showSigned(b){var s=show(Math.abs(b));return (b<0?"−":"+")+s;}
function parseAmt(v){if(v==null)return NaN;v=String(v).replace(/\s| /g,"").replace(",",".");return v===""?NaN:Number(v);}
function daysSince(iso){if(!iso)return Infinity;return Math.floor((Date.now()-new Date(iso).getTime())/864e5);}
function vals(o){return Object.keys(o).map(function(k){return o[k];});}
function accList(){return vals(S.accounts).sort(function(a,b){return (a.world===b.world?0:a.world==="perso"?-1:1)||String(a.name).localeCompare(String(b.name));});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,10);}
function v(id){var el=document.getElementById(id);return el?el.value:"";}

/* ---------- money logic ---------- */
function worth(){
  var w={perso:0,sonsuz:0,acc:{perso:0,sonsuz:0},inv:0,debtIn:0,debtOut:0};
  vals(S.accounts).forEach(function(a){var b=toBase(a.balance,a.currency);w.acc[a.world]+=b;w[a.world]+=b;});
  vals(S.inv).forEach(function(i){var b=toBase(i.value,i.currency);w.inv+=b;w[i.world||"perso"]+=b;});
  vals(S.debts).forEach(function(d){if(d.settled)return;var b=toBase(d.amount,d.currency);var wd=d.world||"perso";
    if(d.direction==="in"){w.debtIn+=b;w[wd]+=b;}else{w.debtOut+=b;w[wd]-=b;}});
  w.total=w.perso+w.sonsuz;return w;
}
function stats(world,mk){
  var r={inn:0,out:0,cat:{},incat:{},count:0};
  vals(S.tx).forEach(function(t){
    if(!t.date||t.date.slice(0,7)!==mk)return;
    var b=+t.base||0;
    if(t.type==="depense"&&t.world===world){r.out+=b;r.cat[t.category]=(r.cat[t.category]||0)+b;r.count++;}
    else if(t.type==="revenu"&&t.world===world){r.inn+=b;r.incat[t.category]=(r.incat[t.category]||0)+b;r.count++;}
    else if(t.type==="transfert"&&t.fromWorld!==t.toWorld){
      if(t.toWorld===world){var c1=world==="perso"?"Salaire Sonsuz":"Apport";r.inn+=b;r.incat[c1]=(r.incat[c1]||0)+b;r.count++;}
      if(t.fromWorld===world){var c2=world==="sonsuz"?"Rémunération d'Aurel":"Apport à Sonsuz";r.out+=b;r.cat[c2]=(r.cat[c2]||0)+b;r.count++;}
    }
  });
  r.net=r.inn-r.out;r.rate=r.inn>0?r.net/r.inn:null;return r;
}
function alerts(){
  var out=[],accs=vals(S.accounts),now=new Date(),mk=monthKey(now);
  var stale=accs.filter(function(a){return daysSince(a.checkedAt)>7;});
  if(stale.length)out.push(["w","Soldes à vérifier","Pas pointés depuis plus de 7 jours : "+stale.slice(0,3).map(function(a){return esc(a.name);}).join(", ")+(stale.length>3?"…":"")+". Onglet Comptes, bouton « Pointer mes soldes »."]);
  var txs=vals(S.tx).filter(function(t){return t.type!=="ajustement";});
  var last=txs.reduce(function(m,t){return t.createdAt>m?t.createdAt:m;},"");
  if(accs.length&&(!last||daysSince(last)>=3))out.push(["w","Saisies en retard",last?"Dernière opération il y a "+daysSince(last)+" jours. Note tes dépenses du jour maintenant, 10 secondes chacune.":"Aucune opération encore. Commence par ta prochaine dépense."]);
  var hasSal=txs.some(function(t){return t.date&&t.date.slice(0,7)===mk&&((t.type==="transfert"&&t.fromWorld==="sonsuz"&&t.toWorld==="perso")||(t.type==="revenu"&&t.world==="perso"&&t.category==="Salaire Sonsuz"));});
  var hasSon=accs.some(function(a){return a.world==="sonsuz";});
  if(hasSon&&!hasSal&&now.getDate()>=5)out.push(["w","Salaire non versé","Sonsuz ne t'a pas encore versé ton salaire ce mois-ci. Fais un transfert Sonsuz → Moi (vers Enpara) pour que ton coût de vie reste mesurable."]);
  vals(S.debts).forEach(function(d){if(!d.settled&&d.due&&d.due<today())out.push(["n",d.direction==="in"?"Remboursement en retard":"Échéance dépassée",esc(d.person)+" · "+fmt(+d.amount,d.currency)+" · prévu le "+esc(d.due)]);});
  var bud=(S.settings&&S.settings.budgets)||{},st=stats("perso",mk);
  Object.keys(bud).forEach(function(c){if(bud[c]>0&&(st.cat[c]||0)>bud[c])out.push(["n","Budget dépassé : "+esc(c),show(st.cat[c])+" dépensés pour "+show(bud[c])+" prévus."]);});
  var m=now.getMonth();
  if((m===9||m===10)&&!(bud["Factures"]>0))out.push(["w","L'hiver arrive","On est en automne : les factures de gaz montent à Istanbul dès novembre. Fixe un budget « Factures » dans les réglages."]);
  return out;
}

function stat(k,val,cls){return '<div class="stat"><div class="k">'+k+'</div><div class="v '+(cls||"")+'">'+val+'</div></div>';}
function budgetCard(st){
  var bud=(S.settings&&S.settings.budgets)||{};
  var cats=Object.keys(st.cat).concat(Object.keys(bud).filter(function(c){return bud[c]>0;}));
  cats=cats.filter(function(c,i){return cats.indexOf(c)===i;}).sort(function(a,b){return (st.cat[b]||0)-(st.cat[a]||0);});
  var h='<section class="card"><h2>Où part mon argent<span class="sp"></span><button type="button" class="btn sm" data-action="settings">Budgets</button></h2>';
  if(!cats.length)return h+'<p class="mut" style="margin:0">Aucune dépense ce mois-ci. Chaque saisie apparaîtra ici par catégorie.</p></section>';
  var max=Math.max.apply(null,cats.map(function(c){return Math.max(st.cat[c]||0,bud[c]||0);}))||1;
  h+='<div class="budget">';
  cats.slice(0,8).forEach(function(c){var val=st.cat[c]||0,b=bud[c]||0,over=b>0&&val>b;var ref=b>0?b:max;var pct=Math.min(100,val/ref*100);
    h+='<div class="brow"><div class="t"><b>'+esc(c)+'</b><span>'+show(val)+(b>0?" / "+show(b):"")+'</span></div><div class="bar"><i style="width:'+pct+'%;background:var(--'+(over?"neg":b>0&&val>b*.8?"warn":"accent")+')"></i></div></div>';});
  return h+'</div></section>';
}
function trendCard(){

  if(t.dataset.view){S.view=t.dataset.view;render();window.scrollTo(0,0);return;}
  if(t.dataset.disp){S.disp=t.dataset.disp;try{localStorage.setItem("kasa.disp",S.disp);}catch(x){}render();return;}
  var a=t.dataset.action;
  if(a==="close")return closeSheet();
  if(a==="m-prev"){S.month=shiftMonth(S.month,-1);return render();}
  if(a==="m-next"){S.month=shiftMonth(S.month,1);return render();}
  if(a==="txworld"){S.txWorld=t.dataset.w;return render();}
  if(a==="ask")return ask(t.dataset.q);
  if(!S.ready)return;
  if(a==="quickadd")return quickAdd();
  if(a==="addacc")return accountSheet(null);
  if(a==="preset"){var p=t.dataset.p.split("-");return accountSheet(null,PRESETS[+p[0]].items[+p[1]]);}
  if(a==="editacc")return accountSheet(S.accounts[t.dataset.id]);
  if(a==="check")return checkSheet();
  if(a==="adddebt")return debtSheet();
  if(a==="addinv")return invSheet(null);
  if(a==="editinv")return invSheet(S.inv[t.dataset.id]);
  if(a==="settings")return settingsSheet();
  if(a==="settle"||a==="deltx"||a==="delacc"||a==="delinv"){
    if(!t.dataset.armed){var old=t.textContent;t.dataset.armed="1";t.textContent=a==="settle"?"Confirmer ?":"Supprimer ?";setTimeout(function(){if(t.isConnected){delete t.dataset.armed;t.textContent=old;}},3500);return;}
    t.disabled=true;
    try{
      if(a==="settle")await api("settle-debt",{id:t.dataset.id});
      if(a==="deltx")await api("delete-tx",{id:t.dataset.id});
      if(a==="delinv"){await api("delete-inv",{id:t.dataset.id});closeSheet();}
      if(a==="delacc"){await api("delete-account",{id:t.dataset.id});closeSheet();}
      await load();
    }catch(err){t.disabled=false;t.textContent="Échec";var er=document.getElementById("shErr");if(er)er.textContent=err.message;}
  }
});

/* ---------- boot ---------- */
async function boot(){
  if(!token())return showGate("");
  try{await load();tabs.hidden=false;}
  catch(e){if(e.status!==401)view.innerHTML='<div class="card empty"><h3>Kasa ne répond pas</h3><p>'+esc(e.message)+'</p><button type="button" class="btn pri" onclick="location.reload()">Réessayer</button></div>';}
}
tabs.hidden=true;
boot();
})();
</script>
</body>
</html>
